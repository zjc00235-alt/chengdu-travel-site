<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>定制咨询 | 蓉城轻旅</title>
  <meta name="description" content="联系蓉城轻旅成都旅行社，定制成都与川西小团路线。">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header solid" data-header>
    <nav class="nav">
      <a class="brand" href="index.html"><span class="brand-mark">蓉</span><span>蓉城轻旅</span></a>
      <button class="menu-toggle" type="button" data-menu-toggle aria-label="打开菜单"><span></span><span></span></button>
      <div class="nav-links" data-menu>
        <a href="index.html">首页</a>
        <a href="routes.html">精选路线</a>
        <a href="customize.html" aria-current="page">定制咨询</a>
      </div>
    </nav>
  </header>

  <main class="page-main">
    <section class="page-hero contact-hero">
      <div>
        <p class="eyebrow">Customize</p>
        <h1>告诉我们你的节奏，行程会更像一次假期</h1>
        <p>人数、日期、酒店位置、想吃什么、想少走路还是多拍照，都可以成为路线的一部分。</p>
      </div>
    </section>

    <section class="section contact-layout">
      <div class="contact-panel">
        <p class="eyebrow">Contact</p>
        <h2>成都本地顾问</h2>
        <div class="contact-row">
          <span>电话</span>
          <strong>028-8666 2026</strong>
        </div>
        <div class="contact-row">
          <span>微信</span>
          <strong>RongTrip-CD</strong>
        </div>
        <div class="contact-row">
          <span>地址</span>
          <strong>成都市锦江区春熙路旅行服务中心</strong>
        </div>
        <p class="note">工作时间 09:00-21:00，通常 30 分钟内回复初步方案。</p>
      </div>

      <form class="inquiry-form">
        <label>
          出行人数
          <input type="text" name="people" placeholder="例如：2 位成人 + 1 位儿童">
        </label>
        <label>
          预计日期
          <input type="text" name="date" placeholder="例如：11 月中旬，3 天 2 晚">
        </label>
        <label>
          偏好路线
          <select name="route">
            <option>成都城市慢游</option>
            <option>熊猫亲子小团</option>
            <option>青城山都江堰</option>
            <option>成都 + 川西短线</option>
          </select>
        </label>
        <label>
          想特别安排的内容
          <textarea name="message" rows="5" placeholder="比如少走路、想吃火锅、需要接送机、想拍照等"></textarea>
        </label>
        <button class="button primary form-button" type="button">发送咨询</button>
      </form>
    </section>
  </main>

  <footer class="footer">
    <p>蓉城轻旅成都旅行社</p>
    <span>小团定制 · 城市慢游 · 川西短线</span>
  </footer>
  <script src="js/main.js"></script>
</body>
</html>
